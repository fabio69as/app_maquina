name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generar carpeta android (plataforma nativa)
        run: |
          flutter create --platforms=android --project-name mh_control temp_scaffold
          cp -r temp_scaffold/android ./android
          rm -rf temp_scaffold

      - name: Agregar permisos de Bluetooth al manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\
              <uses-permission android:name="android.permission.BLUETOOTH" />\
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
          cat "$MANIFEST"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Parchear compileSdkVersion del plugin flutter_bluetooth_serial
        run: |
          PLUGIN_GRADLE=$(find "${PUB_CACHE:-$HOME/.pub-cache}" -path "*flutter_bluetooth_serial-0.4.0/android/build.gradle" | head -n 1)
          echo "Archivo encontrado: $PLUGIN_GRADLE"
          if [ -z "$PLUGIN_GRADLE" ]; then
            echo "No se encontro el build.gradle del plugin"
            exit 1
          fi
          cat "$PLUGIN_GRADLE"
          echo "----- Aplicando parche -----"
          sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 34/' "$PLUGIN_GRADLE"
          cat "$PLUGIN_GRADLE"

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: mh-control-apk
          path: build/app/outputs/flutter-apk/app-release.apk
